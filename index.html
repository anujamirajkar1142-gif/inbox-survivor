<!DOCTYPE html>
<html>
<head>
    <title>Inbox Survivor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game">
    <h1>📧 Inbox Survivor</h1>

    <div id="emailBox">Loading...</div>

    <div id="buttons">
        <button onclick="choose('real')">REAL</button>
        <button onclick="choose('spam')">SPAM</button>
    </div>

    <p id="score">Score: 0</p>
    <p id="combo">Combo: 0</p>
    <p id="chaos">Chaos: 0%</p>
    <p id="time">Time: 60</p>

    <audio id="correctSound" src="assets/correct.mp3"></audio>
    <audio id="wrongSound" src="assets/wrong.mp3"></audio>
</div>

<script src="game.js"></script>
</body>
</html>
